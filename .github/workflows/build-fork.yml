name: build-fork-aarch64

# ── 给 fork 用的 aarch64 编译 / 打包 workflow ───────────────────────────────
# 这个 fork 的 Actions 权限被设为「只允许 yjw8448 自己仓库里的 action」，
# 所以 actions/checkout、dtolnay/rust-toolchain、actions/setup-node、
# actions/upload-artifact 等第三方 action 全部被拒（run 卡在 queued）。
# 本文件**完全不用任何第三方 action**：
#   - 检出：git clone（用 GITHUB_TOKEN）
#   - Rust：rustup 官方安装脚本
#   - 打包：node pack.mjs（runner 自带 node）
#   - 上传：gh CLI（runner 自带）创建 Release 并上传 asset
#
# 编译目标：aarch64-unknown-linux-musl（完全静态，不依赖宿主机 glibc）。
# 原因：之前用 aarch64-unknown-linux-gnu 在 ubuntu-latest（glibc 2.39）编出的
# 二进制要求 GLIBC_2.39，而用户 NAS 容器是 glibc 2.36 → 启动即崩（退出码 1）。
# 改用 zigbuild 编 musl 静态后，产物可在任意 aarch64 Linux 上运行。
# zig 自带 C 交叉编译，能编 rusqlite(bundled) 的 SQLite C 代码。
#
# 产物是「未签名」包，但网关允许安装（界面标黄）——见 sign-pack action 注释。
#
# 用法：push 到 fork 默认分支后，Actions 标签手动 Run workflow。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '包版本号（需与 pack.json 的 version 一致，默认 3.4.2）'
        required: false
        default: '3.4.2'
        type: string
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN 需要写权限才能建 Release / 推 tag
permissions:
  contents: write

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 git + python（zigbuild 通过 pip 装）
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip

      - name: 安装 Rust 工具链（rustup，带 musl 目标）
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-unknown-linux-musl
          cargo --version
          rustc --version

      - name: 安装 cargo-zigbuild（静态 musl 交叉编译，自带 C 编译）
        run: |
          set -euo pipefail
          pip3 install --user cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 检出代码（git clone，不用 actions/checkout）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${TOKEN}@github.com/yjw8448/Agent2Providers.git" repo

      # ── 只编 autoclaw 这一个 feature ──────────────────────────────────────
      # 仓库给每家都做了 cfg(feature) 条件编译（mod.rs / registry() 逐行
      # #[cfg(feature="...")]）。--no-default-features --features autoclaw 会让
      # 其他 32 家代码**完全不进二进制**，产物只剩 autoclaw 国内版/国际版。
      # 再叠 --config profile.release.strip=true 砍掉符号表，进一步缩小体积。
      - name: 交叉编译 autoclaw 单家插件（aarch64 musl 静态，仅 autoclaw feature）
        env:
          CARGO_ZIGBUILD_USE_LTO: '1'
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          cd repo
          cargo zigbuild --target aarch64-unknown-linux-musl --release -p agent2api-providers \
            --no-default-features --features autoclaw \
            --config profile.release.strip=true
          ls -la target/aarch64-unknown-linux-musl/release/agent2api-providers

      - name: 把 musl 二进制放到 gnu 路径，供 pack.mjs 打包
        run: |
          set -euo pipefail
          cd repo
          mkdir -p target/aarch64-unknown-linux-gnu/release
          cp target/aarch64-unknown-linux-musl/release/agent2api-providers \
             target/aarch64-unknown-linux-gnu/release/agent2api-providers
          file target/aarch64-unknown-linux-gnu/release/agent2api-providers

      - name: 打包成 zip（node pack.mjs，不重编、不签名）
        run: |
          set -euo pipefail
          cd repo
          node --version
          node scripts/pack.mjs --target aarch64-unknown-linux-gnu --skip-build

      - name: 上传产物为 Release asset（gh CLI，不用 upload-artifact）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-aarch64-${{ github.run_id }}
        run: |
          set -euo pipefail
          cd repo
          ZIP=$(ls dist/*.zip | head -1)
          echo "uploading: $ZIP"
          gh release create "$TAG" "$ZIP" \
            --title "AutoClaw 单家插件 ${TAG}" \
            --notes "未签名 aarch64(musl 静态) **仅 autoclaw** 构建：--no-default-features --features autoclaw，其他 32 家不进二进制；含 CLIENT_VERSION 2.1.1 + expires_at 回灌修复。pack.json 已只暴露 autoclaw 国内版/国际版。agent2api 界面导入（未签名，界面标黄可装）。"
